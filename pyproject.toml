[project]
name = "tts-utils"
version = "0.2.0"
description = "Text chunking and SSML-lite helpers for TTS pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=7.4"]
[project.urls]
Source = "https://github.com/MichaelSwann2x/tts-utils"
Original = "https://github.com/mirkovicdev/ttsAI"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/tts_utils"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
